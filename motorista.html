<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="icon" type="image/png" href="favicon.png" />
<title>Vianta — Os Meus Serviços</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&family=DM+Mono&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --surface2: #EFECE6;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.2);
    --gold: #B8913A;
    --gold-light: #C9A555;
    --gold-dim: rgba(184,145,58,0.1);
    --text: #1A1A16;
    --muted: #888070;
    --muted2: #C0B8A8;
    --success-bg: #EAF3DE;
    --success-text: #3B6D11;
    --warning-bg: #FDF0DC;
    --warning-text: #8A5A10;
    --info-bg: #E6F1FB;
    --info-text: #185FA5;
    --topbar-bg: #0D0D0B;
    --topbar-border: rgba(196,160,80,0.2);
    --topbar-gold: #C4A050;
    --topbar-muted: #6A6458;
    --radius: 8px;
    --radius-lg: 12px;
    --font: 'DM Sans', sans-serif;
    --serif: 'Cormorant Garamond', serif;
    --mono: 'DM Mono', monospace;
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.5; }
  .page { display: none; }
  .page.active { display: block; }

  /* TOPBAR */
  .topbar {
    background: var(--topbar-bg);
    border-bottom: 0.5px solid var(--topbar-border);
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-img { height: 30px; width: auto; }
  .logo-divider { width: 0.5px; height: 18px; background: var(--topbar-border); }
  .logo-text { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--topbar-muted); font-weight: 300; }

  /* PAGE HEADER */
  .page-header {
    padding: 20px 20px 0;
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .page-header-icon {
    width: 32px; height: 32px;
    background: var(--gold-dim);
    border: 0.5px solid rgba(184,145,58,0.25);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .page-header-title { font-size: 18px; font-weight: 500; color: var(--text); letter-spacing: -0.01em; }
  .page-header-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

  /* CONTAINER */
  .container { max-width: 800px; margin: 0 auto; padding: 16px 20px 80px; }

  /* AGENDA TODAY */
  .today-card {
    background: var(--surface);
    border: 1.5px solid var(--gold);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .today-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .today-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .today-count {
    font-size: 11px;
    color: var(--muted);
    background: var(--surface2);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .today-empty {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 13px;
  }

  /* SERVICE ITEM (agenda & list) */
  .svc-item {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    align-items: flex-start;
  }
  .svc-item:last-child { border-bottom: none; }
  .svc-time {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    min-width: 52px;
    font-family: var(--mono);
    flex-shrink: 0;
  }
  .svc-body { flex: 1; min-width: 0; }
  .svc-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }
  .svc-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1.5;
  }
  .svc-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 20px;
    margin-top: 4px;
  }
  .svc-badge-confirmado { background: var(--success-bg); color: var(--success-text); }
  .svc-badge-pendente { background: var(--warning-bg); color: var(--warning-text); }
  .svc-badge-por-faturar { background: #E8E0F0; color: #5B3A8A; }
  .svc-badge-concluido { background: var(--surface2); color: var(--muted); }
  .svc-badge-cancelado { background: var(--surface2); color: var(--muted); text-decoration: line-through; }

  /* VIEW TOGGLE */
  .view-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .view-btn {
    font-family: var(--font);
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    transition: all 0.15s;
  }
  .view-btn.active { background: var(--gold); border-color: var(--gold); color: #fff; }
  .view-btn:hover:not(.active) { border-color: var(--gold-light); color: var(--text); }

  /* SECTION */
  .section-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted2);
    margin-bottom: 10px;
    margin-top: 20px;
  }

  /* CALENDAR */
  .cal-nav {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .cal-nav-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-family: var(--font);
  }
  .cal-nav-btn:hover { border-color: var(--gold); }
  #cal-title {
    font-size: 14px;
    font-weight: 600;
    min-width: 150px;
    text-align: center;
  }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    margin-bottom: 3px;
  }
  .cal-weekday {
    text-align: center;
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    padding: 4px 0;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .cal-cell {
    min-height: 70px;
    border-radius: 6px;
    padding: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .cal-cell.today { border: 1.5px solid var(--gold); }
  .cal-day-num {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .cal-cell.today .cal-day-num { color: var(--gold); font-weight: 700; }
  .cal-event {
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 3px;
    margin-bottom: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .cal-event:hover { opacity: 0.7; }

  /* DETAIL MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-content {
    background: var(--bg);
    border-radius: 16px;
    width: 460px;
    max-width: 92vw;
    max-height: 85vh;
    overflow-y: auto;
    padding: 22px;
  }
  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-close {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--muted);
    line-height: 1;
  }
  .modal-body { display: flex; flex-direction: column; gap: 7px; font-size: 13px; }
  .modal-body strong { color: var(--text); }

  /* EMPTY */
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
  .empty-icon { font-size: 32px; margin-bottom: 8px; display: block; }

  /* LOADING */
  .loading { text-align: center; padding: 60px 20px; color: var(--muted); }

  /* WEEK day columns */
  .day-column { display: flex; flex-direction: column; gap: 4px; padding: 4px; }

  /* RESPONSIVE */
  @media (max-width: 640px) {
    .topbar { padding: 0 14px; height: 48px; }
    .page-header { padding: 14px 14px 0; }
    .container { padding: 12px 14px 70px; }
    .today-card { padding: 12px 14px; }
    .svc-item { gap: 8px; }
    .svc-time { min-width: 42px; font-size: 12px; }
    .cal-cell { min-height: 56px; padding: 3px; }
    .modal-content { padding: 16px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo-wrap">
    <img class="logo-img" src="favicon.png" alt="Vianta" />
    <div class="logo-divider"></div>
    <span class="logo-text">Os Meus Serviços</span>
  </div>
  <span style="font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--topbar-gold);border:0.5px solid var(--topbar-border);padding:3px 10px;border-radius:20px;" id="driver-name-topbar">Motorista</span>
</div>

<div class="page-header">
  <div class="page-header-icon">🚗</div>
  <div>
    <div class="page-header-title" id="driver-name-header">Os meus serviços</div>
    <div class="page-header-sub" id="driver-subtitle">A carregar…</div>
  </div>
</div>

<div class="container">

  <!-- VIEW TOGGLE -->
  <div class="view-toggle" style="margin-top:12px;">
    <button class="view-btn active" onclick="setView('agenda')">📅 Hoje</button>
    <button class="view-btn" onclick="setView('semana')">🗓️ Semana</button>
    <button class="view-btn" onclick="setView('lista')">📋 Lista</button>
  </div>

  <!-- AGENDA HOJE -->
  <div id="view-agenda" class="page active"></div>

  <!-- SEMANA -->
  <div id="view-semana" class="page">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calPrev()">‹</button>
      <span id="cal-title"></span>
      <button class="cal-nav-btn" onclick="calNext()">›</button>
    </div>
    <div class="cal-weekdays" id="cal-weekdays"></div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <!-- LISTA -->
  <div id="view-lista" class="page"></div>

</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="detail-modal" onclick="if(event.target===this)closeDetail()">
  <div class="modal-content">
    <div class="modal-head">
      <div class="modal-title" id="detail-title"></div>
      <button class="modal-close" onclick="closeDetail()">×</button>
    </div>
    <div class="modal-body" id="detail-body"></div>
  </div>
</div>

<script>
const API = '/.netlify/functions/sheets';
const DRIVER_ID = new URLSearchParams(location.search).get('driver') || '';

const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DAYS_SHORT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

let transfers = [];
let drivers = [];
let driverName = '';
let currentView = 'agenda';
let calDate = new Date();

// ── HELPERS ─────────────────────────────────

function fmtDate(d) {
  if (!d) return '—';
  const [y, m, day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function fmtTime(t) { return t ? t.slice(0,5) : '—'; }
function fmtDateTime(d, t) {
  const dd = fmtDate(d);
  const tt = fmtTime(t);
  return dd + (tt !== '—' ? ' às ' + tt : '');
}
function dirLabel(t) {
  if (t.service_type === 'tour') {
    return '🗺️ ' + (t.origin||'—') + ' → ' + (t.destination||'—') + ' → ' + (t.dropoff||'—');
  }
  if (t.dir === 'custom') return '📍 ' + (t.origin||'—') + ' → ' + (t.destination||'—');
  if (t.dir === 'h2a') return '🏨 → ✈️ Hotel → Aeroporto';
  return '✈️ → 🏨 Aeroporto → Hotel';
}
function svcIcon(t) {
  if (t.service_type === 'tour') return '🗺️';
  if (t.dir === 'custom') return '📍';
  if (t.dir === 'a2h') return '✈️';
  return '🏨';
}
function statusLabel(s) {
  const map = { 'pendente': 'Pendente', 'novo': 'Pendente', 'confirmado': 'Confirmado', 'enviado': 'Confirmado', 'por-faturar': 'Por Faturar', 'concluido': 'Concluído', 'cancelado': 'Cancelado' };
  return map[s] || s;
}
function statusBadge(s) {
  return '<span class="svc-badge svc-badge-' + s + '">' + statusLabel(s) + '</span>';
}
function partnerName(t) {
  // fallback — drivers don't need the full partner resolution, just the hotel field
  return t.hotel || (t.notes ? 'Vianta' : '');
}

// ── LOAD DATA ───────────────────────────────

async function loadData() {
  const [tr, dr] = await Promise.all([
    fetch(API + '?type=transfers').then(r => r.json()),
    fetch(API + '?type=drivers').then(r => r.json()),
  ]);
  transfers = (Array.isArray(tr) ? tr : []).filter(t => String(t.driver) === DRIVER_ID && t.status !== 'cancelado');
  drivers = Array.isArray(dr) ? dr : [];
  driverName = (drivers.find(d => String(d.id) === DRIVER_ID) || {}).name || 'Motorista';
  document.getElementById('driver-name-topbar').textContent = driverName;
  document.getElementById('driver-name-header').textContent = driverName;
  document.getElementById('driver-subtitle').textContent = transfers.length + ' serviço' + (transfers.length !== 1 ? 's' : '');
  renderAgenda();
  renderSemana();
  renderLista();
}

// ── VIEWS ───────────────────────────────────

function setView(v) {
  currentView = v;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  ['agenda','semana','lista'].forEach(id => document.getElementById('view-' + id).classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.querySelector('.view-btn:nth-child(' + (v === 'agenda' ? 1 : v === 'semana' ? 2 : 3) + ')').classList.add('active');
  if (v === 'semana') renderSemana();
}

// ── AGENDA (TODAY) ──────────────────────────

function renderAgenda() {
  const today = new Date();
  const dateStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  const dayName = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'][today.getDay()];

  const todaySvcs = transfers.filter(t => t.date === dateStr).sort((a,b) => (a.time||'').localeCompare(b.time||''));

  let html = '<div class="today-card">';
  html += '<div class="today-header">';
  html += '<div><div class="today-label">' + dayName + '</div><div style="font-size:12px;color:var(--muted);margin-top:1px;">' + fmtDate(dateStr) + '</div></div>';
  html += '<span class="today-count">' + todaySvcs.length + ' serviço' + (todaySvcs.length !== 1 ? 's' : '') + '</span>';
  html += '</div>';

  if (todaySvcs.length === 0) {
    html += '<div class="today-empty">✅ Sem serviços para hoje</div>';
  } else {
    todaySvcs.forEach(t => {
      html += renderSvcItem(t);
    });
  }
  html += '</div>';
  document.getElementById('view-agenda').innerHTML = html;
}

// ── SEMANA ─────────────────────────────────

function calPrev() { calDate.setDate(calDate.getDate() - 7); renderSemana(); }
function calNext() { calDate.setDate(calDate.getDate() + 7); renderSemana(); }

function renderSemana() {
  // Get the Monday of the week containing calDate
  const d = new Date(calDate);
  const day = (d.getDay() + 6) % 7; // Mon = 0
  const monday = new Date(d);
  monday.setDate(d.getDate() - day);

  const weekStart = new Date(monday);
  const weekEnd = new Date(monday);
  weekEnd.setDate(monday.getDate() + 6);

  const label = 'Semana de ' + fmtDate(
    weekStart.getFullYear() + '-' + String(weekStart.getMonth()+1).padStart(2,'0') + '-' + String(weekStart.getDate()).padStart(2,'0')
  );
  document.getElementById('cal-title').textContent = label;

  // index transfers by date
  const byDate = {};
  transfers.forEach(t => {
    if (!t.date) return;
    if (!byDate[t.date]) byDate[t.date] = [];
    byDate[t.date].push(t);
  });

  // Weekday headers
  let html = '';
  const dayNames = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
  dayNames.forEach(dn => { html += '<div class="cal-weekday">' + dn + '</div>'; });
  document.getElementById('cal-weekdays').innerHTML = html;

  // Days
  const today = new Date();
  const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');

  let gridHtml = '';
  for (let i = 0; i < 7; i++) {
    const date = new Date(monday);
    date.setDate(monday.getDate() + i);
    const dateStr = date.getFullYear() + '-' + String(date.getMonth()+1).padStart(2,'0') + '-' + String(date.getDate()).padStart(2,'0');
    const isToday = dateStr === todayStr;
    const dayTransfers = (byDate[dateStr] || []).sort((a,b) => (a.time||'').localeCompare(b.time||''));

    gridHtml += '<div class="cal-cell' + (isToday ? ' today' : '') + '">';
    gridHtml += '<div class="cal-day-num">' + date.getDate() + '</div>';
    dayTransfers.forEach(t => {
      const color = t.status === 'confirmado' || t.status === 'enviado' ? '#3B6D11' : (t.status === 'por-faturar' ? '#5B6ABF' : (t.status === 'concluido' ? '#888070' : '#8A5A10'));
      gridHtml += '<div class="cal-event" style="background:' + color + '22;color:' + color + ';" onclick="openDetail(\'' + t.id + '\')">';
      gridHtml += svcIcon(t) + ' ' + fmtTime(t.time) + ' ' + t.name + '</div>';
    });
    gridHtml += '</div>';
  }
  document.getElementById('cal-grid').innerHTML = gridHtml;
}

// ── LISTA ──────────────────────────────────

function renderLista() {
  const sorted = [...transfers].sort((a,b) => {
    const da = (a.date || '') + ' ' + (a.time || '');
    const db = (b.date || '') + ' ' + (b.time || '');
    return da.localeCompare(db);
  });

  // Group by date
  const byDate = {};
  sorted.forEach(t => {
    if (!byDate[t.date]) byDate[t.date] = [];
    byDate[t.date].push(t);
  });

  const dates = Object.keys(byDate).sort();
  if (dates.length === 0) {
    document.getElementById('view-lista').innerHTML = '<div class="empty"><span class="empty-icon">📭</span>Nenhum serviço atribuído</div>';
    return;
  }

  let html = '';
  dates.forEach(d => {
    html += '<div class="section-label">' + fmtDate(d) + '</div>';
    html += '<div class="today-card" style="border-color:var(--border);">';
    byDate[d].forEach(t => { html += renderSvcItem(t); });
    html += '</div>';
  });
  document.getElementById('view-lista').innerHTML = html;
}

function renderSvcItem(t) {
  return '<div class="svc-item" onclick="openDetail(\'' + t.id + '\')" style="cursor:pointer;">' +
    '<div class="svc-time">' + fmtTime(t.time) + '</div>' +
    '<div class="svc-body">' +
      '<div class="svc-name">' + t.name + '</div>' +
      '<div class="svc-meta">' + dirLabel(t) + '</div>' +
      '<div class="svc-meta">👥 ' + (parseInt(t.adults)||0) + ' adulto(s)' + (t.children ? ' + ' + t.children + ' criança(s)' : '') +
        (t.car_type === 'van' ? ' &nbsp;🚐 Van' : ' &nbsp;🚗 Sedan') +
      '</div>' +
      '<div>' + statusBadge(t.status) + '</div>' +
    '</div>' +
  '</div>';
}

// ── DETAIL MODAL ────────────────────────────

function openDetail(id) {
  const t = transfers.find(x => String(x.id) === String(id));
  if (!t) return;
  document.getElementById('detail-title').textContent = t.name || '—';
  const rows = [];
  rows.push('<div>🔄 ' + dirLabel(t) + '</div>');
  rows.push('<div>📅 <strong>' + fmtDateTime(t.date, t.time) + '</strong>' +
    (t.service_type === 'tour' && t.tour_arrival ? ' — fim <strong>' + fmtTime(t.tour_arrival) + '</strong>' : '') + '</div>');
  rows.push('<div>👥 <strong>' + (parseInt(t.adults)||0) + '</strong> adulto(s)' + (t.children ? ' + <strong>' + t.children + '</strong> criança(s)' : '') + '</div>');
  if (t.luggage) rows.push('<div>🧳 <strong>' + t.luggage + '</strong> bagagem(ns)</div>');
  if (t.child_seat === true || String(t.child_seat).toUpperCase() === 'TRUE') {
    rows.push('<div>🪑 Cadeirinha necessária' + (t.child_ages ? ' — idade(s): ' + t.child_ages : '') + '</div>');
  }
  rows.push('<div>' + (t.car_type === 'van' ? '🚐 Van' : '🚗 Sedan') + '</div>');
  if (t.service_type !== 'tour' && t.flight) {
    rows.push('<div>✈️ Voo <strong>' + t.flight + '</strong>' + (t.arrival ? ' — chegada <strong>' + fmtTime(t.arrival) + '</strong>' : '') + '</div>');
  }
  rows.push('<div>💳 Pagamento: <strong>' + (t.payment === 'driver' ? 'ao motorista' : 'ao hotel') + '</strong></div>');
  if (t.price) rows.push('<div>💶 <strong>' + parseFloat(t.price).toFixed(2) + ' €</strong></div>');
  if (t.phone) rows.push('<div>📱 <strong>' + t.phone + '</strong></div>');
  if (t.hotel) rows.push('<div>🏨 <strong>' + t.hotel + '</strong></div>');
  if (t.notes) rows.push('<div>📝 ' + t.notes + '</div>');
  rows.push('<div style="margin-top:4px;">📌 <strong>' + statusLabel(t.status) + '</strong></div>');

  document.getElementById('detail-body').innerHTML = rows.join('');
  document.getElementById('detail-modal').classList.add('show');
}
function closeDetail() { document.getElementById('detail-modal').classList.remove('show'); }

// ── INIT ────────────────────────────────────
loadData();
</script>
</body>
