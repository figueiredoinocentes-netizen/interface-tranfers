<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vianta — Transfers</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&family=DM+Mono&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --surface2: #EFECE6;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.2);
    --gold: #B8913A;
    --gold-light: #C9A555;
    --gold-dim: rgba(184,145,58,0.1);
    --text: #1A1A16;
    --muted: #888070;
    --muted2: #C0B8A8;
    --success-bg: #EAF3DE;
    --success-text: #3B6D11;
    --warning-bg: #FDF0DC;
    --warning-text: #8A5A10;
    --info-bg: #E6F1FB;
    --info-text: #185FA5;
    --topbar-bg: #0D0D0B;
    --topbar-border: rgba(196,160,80,0.2);
    --topbar-gold: #C4A050;
    --topbar-muted: #6A6458;
    --radius: 8px;
    --radius-lg: 12px;
    --font: 'DM Sans', sans-serif;
    --serif: 'Cormorant Garamond', serif;
    --mono: 'DM Mono', monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.5;
  }

  /* TOPBAR — dark Vianta branding */
  .topbar {
    background: var(--topbar-bg);
    border-bottom: 0.5px solid var(--topbar-border);
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 58px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-img {
    height: 34px;
    width: auto;
  }

  .logo-divider {
    width: 0.5px;
    height: 20px;
    background: var(--topbar-border);
  }

  .logo-text {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--topbar-muted);
    font-weight: 300;
  }

  .tab-bar { display: flex; }

  .tab {
    padding: 0 18px;
    height: 58px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    border-bottom: 1.5px solid transparent;
    color: var(--topbar-muted);
    background: none;
    font-family: var(--font);
    font-weight: 400;
    transition: color 0.2s;
  }

  .tab:hover { color: var(--topbar-gold); }
  .tab.active { color: var(--topbar-gold); border-bottom-color: var(--topbar-gold); }

  /* PAGES */
  .page { display: none; }
  .page.active { display: block; }

  /* PAGE HEADER (light) */
  .page-header {
    padding: 28px 28px 0;
    max-width: 540px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .page-header-icon {
    width: 32px;
    height: 32px;
    background: var(--gold-dim);
    border: 0.5px solid rgba(184,145,58,0.25);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }

  .page-header-title {
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .page-header-hotel {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }

  /* FORM CONTAINER */
  .container {
    max-width: 540px;
    margin: 0 auto;
    padding: 20px 28px 80px;
  }

  .section-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    margin-top: 24px;
  }

  /* DIRECTION TOGGLE */
  .dir-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .dir-btn {
    padding: 12px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font);
    text-align: center;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    line-height: 1.4;
  }

  .dir-btn .dir-icon { font-size: 20px; display: block; margin-bottom: 4px; }
  .dir-btn .dir-label { font-size: 12px; }
  .dir-btn:hover { border-color: var(--gold-light); color: var(--text); }

  .dir-btn.selected {
    border: 1.5px solid var(--gold);
    color: var(--gold);
    background: var(--gold-dim);
    font-weight: 500;
  }

  .route-pill {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 14px;
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .route-pill strong { color: var(--text); }

  /* FORM ELEMENTS */
  .form-group { margin-top: 12px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 5px;
    text-transform: uppercase;
  }

  label .req { color: var(--gold); margin-left: 2px; }

  input[type=text],
  input[type=number],
  input[type=date],
  input[type=time],
  select,
  textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 13px;
    font-size: 14px;
    font-family: var(--font);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    appearance: none;
    -webkit-appearance: none;
  }

  input::placeholder, textarea::placeholder { color: var(--muted2); }

  input:focus, select:focus, textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(184,145,58,0.12);
  }

  textarea { resize: vertical; min-height: 68px; line-height: 1.5; }

  /* CHECKBOX */
  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding: 11px 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .checkbox-row:hover { border-color: var(--gold-light); }

  .checkbox-row input[type=checkbox] {
    width: 16px; height: 16px;
    cursor: pointer;
    accent-color: var(--gold);
  }

  .checkbox-row label {
    font-size: 14px;
    color: var(--text);
    margin: 0;
    cursor: pointer;
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
  }

  /* SUBMIT */
  .btn-submit {
    width: 100%;
    background: var(--topbar-bg);
    color: var(--topbar-gold);
    border: none;
    border-radius: var(--radius);
    padding: 13px;
    font-size: 12px;
    font-weight: 500;
    font-family: var(--font);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 28px;
    transition: opacity 0.2s;
  }

  .btn-submit:hover { opacity: 0.88; }
  .btn-submit:active { opacity: 0.7; }

  .success-banner {
    background: var(--success-bg);
    color: var(--success-text);
    border: 1px solid rgba(59,109,17,0.2);
    border-radius: var(--radius);
    padding: 13px 16px;
    font-size: 14px;
    font-weight: 500;
    text-align: center;
    display: none;
    margin-top: 14px;
  }

  /* PANEL */
  .panel-container {
    max-width: 680px;
    margin: 0 auto;
    padding: 32px 28px 80px;
  }

  .panel-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .panel-title {
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .panel-sub {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }

  .count-badge {
    font-size: 11px;
    letter-spacing: 0.03em;
    background: var(--info-bg);
    color: var(--info-text);
    border-radius: 99px;
    padding: 4px 12px;
    font-weight: 500;
    white-space: nowrap;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    margin-bottom: 10px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .card:hover { border-color: var(--border-strong); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }

  .card-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }

  .card-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  .status-badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 99px;
    font-weight: 500;
  }

  .status-novo { background: var(--info-bg); color: var(--info-text); }
  .status-enviado { background: var(--success-bg); color: var(--success-text); }

  .card-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px 20px;
    font-size: 13px;
    color: var(--muted);
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .card-details strong { color: var(--text); }

  .tag {
    font-size: 11px;
    border-radius: 99px;
    padding: 2px 8px;
    font-weight: 500;
    margin-left: 5px;
  }

  .tag-child { background: var(--warning-bg); color: var(--warning-text); }
  .tag-hotel { background: var(--info-bg); color: var(--info-text); }

  .card-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
  }

  .driver-select { flex: 1; }

  .btn-copy-msg {
    background: none;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 7px 14px;
    font-size: 12px;
    letter-spacing: 0.03em;
    cursor: pointer;
    color: var(--text);
    font-family: var(--font);
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }

  .btn-copy-msg:hover { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }

  .copy-block {
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 11px 14px;
    font-size: 13px;
    font-family: var(--mono);
    color: var(--text);
    line-height: 1.7;
    margin-top: 10px;
    white-space: pre-wrap;
    display: none;
    border: 1px solid var(--border);
  }

  .btn-clipboard {
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    display: none;
    align-items: center;
    gap: 4px;
    margin-top: 7px;
    padding: 0;
    transition: color 0.15s;
  }

  .btn-clipboard:hover { color: var(--gold); }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  .empty-icon { font-size: 36px; margin-bottom: 10px; display: block; }

  @media (max-width: 480px) {
    .topbar { padding: 0 16px; }
    .form-row { grid-template-columns: 1fr; }
    .card-details { grid-template-columns: 1fr; }
    .card-actions { flex-wrap: wrap; }
    .driver-select { width: 100%; }
    .container, .page-header { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>

<script>
const HOTEL = 'Onyria';
const DRIVERS = ['Abdel Rahman', 'Carlos Mendes', 'Jorge Pinheiro', 'Sandro Costa', 'Miguel Ferreira'];
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxFCFuyaAO1MG0s4ZF6Uwz_Ilm1Kum7RXAcxr0YMqVXIdLIsU3C5c12UIbnY-ryBwolxw/exec';

let dir = 'h2a';
let payment = 'driver';
let transfers = [];

// ── Google Sheets API ──────────────────────────────────────────

async function apiGet() {
  try {
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();
    return data;
  } catch(e) {
    console.error('Erro ao carregar transfers:', e);
    return [];
  }
}

async function apiPost(payload) {
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
  } catch(e) {
    console.error('Erro ao guardar transfer:', e);
  }
}

async function apiUpdate(payload) {
  try {
    await fetch(SCRIPT_URL + '?action=update', {
      method: 'POST',
      body: JSON.stringify(payload)
    });
  } catch(e) {
    console.error('Erro ao atualizar transfer:', e);
  }
}

// ── Tabs ───────────────────────────────────────────────────────

function switchTab(t) {
  document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('active', (t === 'hotel' && i === 0) || (t === 'duarte' && i === 1)));
  document.getElementById('page-hotel').classList.toggle('active', t === 'hotel');
  document.getElementById('page-duarte').classList.toggle('active', t === 'duarte');
  if (t === 'duarte') loadPanel();
}

function setDir(d) {
  dir = d;
  document.getElementById('btn-h2a').classList.toggle('selected', d === 'h2a');
  document.getElementById('btn-a2h').classList.toggle('selected', d === 'a2h');
  document.getElementById('route-text').innerHTML = d === 'h2a'
    ? '<strong>Onyria</strong> → Aeroporto de Lisboa'
    : 'Aeroporto de Lisboa → <strong>Onyria</strong>';
}

function setPayment(p) {
  payment = p;
  document.getElementById('btn-pay-driver').classList.toggle('selected', p === 'driver');
  document.getElementById('btn-pay-hotel').classList.toggle('selected', p === 'hotel');
}

// ── Submit form ────────────────────────────────────────────────

async function submitTransfer() {
  const name = document.getElementById('f-name').value.trim();
  const adults = document.getElementById('f-adults').value;
  const date = document.getElementById('f-date').value;
  const time = document.getElementById('f-time').value;
  if (!name || !adults || !date || !time) {
    alert('Por favor preenche todos os campos obrigatórios (*).');
    return;
  }

  const btn = document.querySelector('.btn-submit');
  btn.textContent = 'A enviar…';
  btn.disabled = true;

  const t = {
    id: Date.now(), hotel: HOTEL, dir,
    name,
    adults: parseInt(adults) || 0,
    children: parseInt(document.getElementById('f-children').value) || 0,
    luggage: parseInt(document.getElementById('f-luggage').value) || 0,
    childSeat: document.getElementById('f-child-seat').checked,
    payment,
    date, time,
    flight: document.getElementById('f-flight').value.trim(),
    arrival: document.getElementById('f-arrival').value,
    notes: document.getElementById('f-notes').value.trim(),
    status: 'novo', driver: ''
  };

  await apiPost(t);

  ['f-name','f-adults','f-children','f-luggage','f-date','f-time','f-flight','f-arrival','f-notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-child-seat').checked = false;
  setDir('h2a');
  setPayment('driver');

  btn.textContent = 'Enviar pedido';
  btn.disabled = false;

  const banner = document.getElementById('success-banner');
  banner.style.display = 'block';
  setTimeout(() => { banner.style.display = 'none'; }, 4000);
}

// ── Panel ──────────────────────────────────────────────────────

async function loadPanel() {
  const list = document.getElementById('transfers-list');
  list.innerHTML = '<div class="empty"><span class="empty-icon">⏳</span>A carregar…</div>';
  transfers = await apiGet();
  renderPanel();
}

function fmtDate(d) {
  if (!d) return '—';
  const [y, m, day] = d.split('-');
  return day + '/' + m + '/' + y;
}

function dirLabel(d) {
  return d === 'h2a' ? HOTEL + ' → Aeroporto' : 'Aeroporto → ' + HOTEL;
}

function buildMsg(t) {
  let m = '🚗 *TRANSFER VIANTA*\n';
  m += '🏨 Hotel: ' + t.hotel + '\n';
  m += '👤 Cliente: ' + t.name + '\n';
  m += '📅 Data: ' + fmtDate(t.date) + ' às ' + t.time + '\n';
  m += '🔄 ' + dirLabel(t.dir) + '\n';
  m += '👥 Adultos: ' + t.adults;
  if (t.children) m += ' | Crianças: ' + t.children;
  m += '\n';
  if (t.luggage) m += '🧳 Bagagens: ' + t.luggage + '\n';
  if (t.childSeat) m += '🪑 Cadeirinha necessária\n';
  m += '💳 Pagamento: ' + (t.payment === 'driver' ? 'ao motorista' : 'ao hotel') + '\n';
  if (t.flight) { m += '✈️ Voo: ' + t.flight; if (t.arrival) m += ' — chegada ' + t.arrival; m += '\n'; }
  if (t.notes) m += '📝 Notas: ' + t.notes + '\n';
  return m;
}

function renderPanel() {
  const list = document.getElementById('transfers-list');
  const novos = transfers.filter(t => t.status === 'novo').length;
  document.getElementById('count-badge').textContent = novos + ' novo' + (novos !== 1 ? 's' : '');

  if (!transfers.length) {
    list.innerHTML = '<div class="empty"><span class="empty-icon">📭</span>Sem transferes por agora.</div>';
    return;
  }

  list.innerHTML = transfers.map(t => {
    const opts = DRIVERS.map(d => '<option value="' + d + '" ' + (t.driver === d ? 'selected' : '') + '>' + d + '</option>').join('');
    const childTag = t.childSeat ? '<span class="tag tag-child">cadeirinha</span>' : '';
    const payTag = t.payment === 'hotel' ? '<span class="tag tag-hotel">pag. hotel</span>' : '';
    const dirIcon = t.dir === 'h2a' ? '🏨→✈️' : '✈️→🏨';
    return '<div class="card" id="card-' + t.id + '">' +
      '<div class="card-header">' +
        '<div>' +
          '<div class="card-name">' + t.name + childTag + payTag + '</div>' +
          '<div class="card-meta">' + dirIcon + ' ' + dirLabel(t.dir) + ' · ' + t.hotel + '</div>' +
        '</div>' +
        '<span class="status-badge status-' + t.status + '" id="badge-' + t.id + '">' + t.status + '</span>' +
      '</div>' +
      '<div class="card-details">' +
        '<div>📅 ' + fmtDate(t.date) + ' às <strong>' + t.time + '</strong></div>' +
        '<div>👥 <strong>' + t.adults + '</strong> adulto' + (t.adults !== 1 ? 's' : '') + (t.children ? ' + ' + t.children + ' criança' + (t.children !== 1 ? 's' : '') : '') + '</div>' +
        (t.luggage ? '<div>🧳 <strong>' + t.luggage + '</strong> bagagem' + (t.luggage !== 1 ? 's' : '') + '</div>' : '') +
        '<div>💳 ' + (t.payment === 'driver' ? 'Pag. motorista' : 'Pag. hotel') + '</div>' +
        (t.flight ? '<div>✈️ ' + t.flight + (t.arrival ? ' — chegada ' + t.arrival : '') + '</div>' : '') +
        (t.notes ? '<div style="grid-column:1/-1">📝 ' + t.notes + '</div>' : '') +
      '</div>' +
      '<div class="card-actions">' +
        '<select class="driver-select" id="drv-' + t.id + '" onchange="assignDriver(' + t.id + ', this.value)">' +
          '<option value="">Atribuir motorista...</option>' + opts +
        '</select>' +
        '<button class="btn-copy-msg" onclick="showCopy(' + t.id + ')">Copiar mensagem</button>' +
      '</div>' +
      '<div class="copy-block" id="copy-' + t.id + '"></div>' +
      '<button class="btn-clipboard" id="clipbtn-' + t.id + '" onclick="toClipboard(' + t.id + ')">📋 Copiar para clipboard</button>' +
    '</div>';
  }).join('');
}

async function assignDriver(id, driver) {
  const t = transfers.find(x => x.id == id);
  if (t) {
    t.driver = driver;
    await apiUpdate({ id: t.id, driver });
  }
}

async function showCopy(id) {
  const t = transfers.find(x => x.id == id);
  if (!t) return;
  t.status = 'enviado';
  await apiUpdate({ id: t.id, status: 'enviado' });
  document.getElementById('copy-' + id).textContent = buildMsg(t);
  document.getElementById('copy-' + id).style.display = 'block';
  document.getElementById('clipbtn-' + id).style.display = 'flex';
  const badge = document.getElementById('badge-' + id);
  badge.className = 'status-badge status-enviado';
  badge.textContent = 'enviado';
  const novos = transfers.filter(x => x.status === 'novo').length;
  document.getElementById('count-badge').textContent = novos + ' novo' + (novos !== 1 ? 's' : '');
}

function toClipboard(id) {
  const el = document.getElementById('copy-' + id);
  const btn = document.getElementById('clipbtn-' + id);
  navigator.clipboard.writeText(el.textContent).then(() => {
    btn.textContent = '✓ Copiado!';
    setTimeout(() => { btn.innerHTML = '📋 Copiar para clipboard'; }, 2000);
  });
}
</script>
