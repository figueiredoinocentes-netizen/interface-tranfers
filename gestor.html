<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/png" href="favicon.png" />
<title>Vianta — Gestão de Frota</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&family=DM+Mono&display=swap" rel="stylesheet" />
<script>/* supabase removed */</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F5F3EE;
    --surface: #FFFFFF;
    --surface2: #EFECE6;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.2);
    --gold: #B8913A;
    --gold-light: #C9A555;
    --gold-dim: rgba(184,145,58,0.1);
    --text: #1A1A16;
    --muted: #888070;
    --muted2: #C0B8A8;
    --success-bg: #EAF3DE;
    --success-text: #3B6D11;
    --warning-bg: #FDF0DC;
    --warning-text: #8A5A10;
    --info-bg: #E6F1FB;
    --info-text: #185FA5;
    --danger-bg: #FDECEA;
    --danger-text: #991B1B;
    --topbar-bg: #0D0D0B;
    --topbar-border: rgba(196,160,80,0.2);
    --topbar-gold: #C4A050;
    --topbar-muted: #6A6458;
    --radius: 8px;
    --radius-lg: 12px;
    --font: 'DM Sans', sans-serif;
    --serif: 'Cormorant Garamond', serif;
    --mono: 'DM Mono', monospace;
  }

  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.5; }

  .page { display: none; }
  .page.active { display: block; }

  /* TOPBAR */
  .topbar {
    background: var(--topbar-bg);
    border-bottom: 0.5px solid var(--topbar-border);
    padding: 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 58px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo-wrap { display: flex; align-items: center; gap: 12px; }
  .logo-img { height: 34px; width: auto; }
  .logo-divider { width: 0.5px; height: 20px; background: var(--topbar-border); }
  .logo-text { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--topbar-muted); font-weight: 300; }
  .topbar-badge {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--topbar-gold);
    border: 0.5px solid var(--topbar-border);
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 400;
  }

  /* TAB SWITCHER */
  .tab-switcher { display: flex; justify-content: center; padding: 28px 28px 0; }
  .tab-group { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 4px; gap: 4px; }
  .tab { padding: 10px 28px; border-radius: 9px; font-size: 13px; font-weight: 500; letter-spacing: 0.02em; cursor: pointer; border: none; background: none; color: var(--muted); font-family: var(--font); transition: background 0.15s, color 0.15s, box-shadow 0.15s; }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

  /* CONTAINER */
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 28px 80px; }

  /* PAGE HEADER */
  .page-header { padding: 28px 28px 0; max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
  .page-header-icon { width: 32px; height: 32px; background: var(--gold-dim); border: 0.5px solid rgba(184,145,58,0.25); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .page-header-title { font-size: 18px; font-weight: 500; color: var(--text); letter-spacing: -0.01em; }
  .page-header-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

  /* SECTION LABEL */
  .section-label { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted2); margin-bottom: 10px; margin-top: 28px; }
  .section-label:first-child { margin-top: 0; }

  /* STATUS BADGE */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 500; letter-spacing: 0.04em;
    padding: 3px 10px; border-radius: 20px; white-space: nowrap;
  }
  .badge-pendente { background: var(--warning-bg); color: var(--warning-text); }
  .badge-confirmado { background: var(--success-bg); color: var(--success-text); }
  .badge-cancelado { background: var(--danger-bg); color: var(--danger-text); }
  .badge-concluido { background: var(--surface2); color: var(--muted); }

  /* TRANSFERS TABLE */
  .transfers-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  .transfers-table th {
    text-align: left; font-size: 10px; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted2); padding: 10px 12px;
    border-bottom: 1px solid var(--border); background: var(--surface2);
  }
  .transfers-table th:first-child { border-radius: 8px 0 0 0; }
  .transfers-table th:last-child { border-radius: 0 8px 0 0; }
  .transfers-table td { padding: 12px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13px; background: var(--surface); }
  .transfers-table tr:last-child td { border-bottom: none; }
  .transfers-table tr:last-child td:first-child { border-radius: 0 0 0 8px; }
  .transfers-table tr:last-child td:last-child { border-radius: 0 0 8px 0; }
  .transfers-table tr:hover td { background: #FAFAF7; }

  .table-wrap { border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }

  .cell-name { font-weight: 500; }
  .cell-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .cell-hotel { font-size: 11px; color: var(--muted); }

  /* INLINE SELECT */
  .inline-select {
    font-family: var(--font); font-size: 12px; color: var(--text);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 8px; cursor: pointer;
    min-width: 130px; outline: none;
  }
  .inline-select:focus { border-color: var(--gold); }

  /* STATUS SELECT */
  .status-select {
    font-family: var(--font); font-size: 11px; font-weight: 500;
    border: none; border-radius: 20px; padding: 4px 10px; cursor: pointer; outline: none;
  }
  .status-select.pendente { background: var(--warning-bg); color: var(--warning-text); }
  .status-select.confirmado { background: var(--success-bg); color: var(--success-text); }
  .status-select.cancelado { background: var(--danger-bg); color: var(--danger-text); }
  .status-select.concluido { background: var(--surface2); color: var(--muted); }

  /* SAVE BTN */
  .btn-save {
    font-family: var(--font); font-size: 11px; font-weight: 500;
    background: var(--gold); color: #fff; border: none;
    border-radius: 6px; padding: 5px 12px; cursor: pointer;
    transition: background 0.15s;
  }
  .btn-save:hover { background: var(--gold-light); }
  .btn-save:disabled { background: var(--muted2); cursor: default; }

  /* TEAM SECTION — cards grid */
  .team-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 4px; }

  .team-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
  .team-card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .team-card-title { font-size: 13px; font-weight: 500; }
  .team-card-body { padding: 0; }

  .team-list-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .team-list-item:last-child { border-bottom: none; }
  .team-item-name { font-weight: 500; }
  .team-item-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .btn-remove {
    font-family: var(--font); font-size: 11px;
    background: none; border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 10px; cursor: pointer;
    color: var(--muted); transition: all 0.15s;
  }
  .btn-remove:hover { border-color: #991B1B; color: #991B1B; }

  /* ADD FORM */
  .add-form { padding: 16px 20px; background: var(--surface2); border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .add-input {
    flex: 1; font-family: var(--font); font-size: 13px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 12px; outline: none;
    color: var(--text);
  }
  .add-input:focus { border-color: var(--gold); }
  .btn-add {
    font-family: var(--font); font-size: 12px; font-weight: 500;
    background: var(--gold); color: #fff; border: none;
    border-radius: var(--radius); padding: 8px 16px; cursor: pointer;
    white-space: nowrap; transition: background 0.15s;
  }
  .btn-add:hover { background: var(--gold-light); }

  /* FILTERS */
  .filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-btn {
    font-family: var(--font); font-size: 12px; font-weight: 400;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 5px 14px; cursor: pointer;
    color: var(--muted); transition: all 0.15s;
  }
  .filter-btn:hover, .filter-btn.active { background: var(--gold); border-color: var(--gold); color: #fff; }

  /* EMPTY */
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: #1A1A16; color: #fff; font-size: 13px;
    padding: 10px 20px; border-radius: 8px; z-index: 100;
    opacity: 0; transition: opacity 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .dir-badge {
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 4px; font-weight: 500;
  }
  .dir-h2a { background: var(--info-bg); color: var(--info-text); }
  .dir-a2h { background: var(--gold-dim); color: var(--gold); }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo-wrap">
    <img class="logo-img" src="favicon.png" alt="Vianta" />
    <div class="logo-divider"></div>
    <span class="logo-text">Transfers</span>
  </div>
  <span class="topbar-badge">Gestão de Frota</span>
</div>

<!-- TAB SWITCHER -->
<div class="tab-switcher">
  <div class="tab-group">
    <button class="tab active" onclick="switchTab('servicos')">Serviços</button>
    <button class="tab" onclick="switchTab('equipa')">Motoristas & Viaturas</button>
    <button class="tab" onclick="switchTab('calendario')">Calendário</button>
  </div>
</div>

<!-- SERVIÇOS -->
<div id="page-servicos" class="page active">
  <div class="page-header">
    <div class="page-header-icon">🗓️</div>
    <div>
      <div class="page-header-title">Serviços</div>
      <div class="page-header-sub">Todos os pedidos de transfer</div>
    </div>
  </div>
  <div class="container">
    <div class="filters" id="filters">
      <button class="filter-btn active" onclick="setFilter('todos', this)">Todos</button>
      <button class="filter-btn" onclick="setFilter('pendente', this)">Pendentes</button>
      <button class="filter-btn" onclick="setFilter('confirmado', this)">Confirmados</button>
      <button class="filter-btn" onclick="setFilter('concluido', this)">Concluídos</button>
      <button class="filter-btn" onclick="setFilter('cancelado', this)">Cancelados</button>
    </div>
    <div class="table-wrap">
      <table class="transfers-table">
        <thead>
          <tr>
            <th>Cliente / Hotel</th>
            <th>Data & Hora</th>
            <th>Percurso</th>
            <th>Voo</th>
            <th>Pax</th>
            <th>Motorista</th>
            <th>Viatura</th>
            <th>Estado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="transfers-tbody">
          <tr><td colspan="9" class="empty">A carregar…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- EQUIPA -->
<div id="page-equipa" class="page">
  <div class="page-header">
    <div class="page-header-icon">👥</div>
    <div>
      <div class="page-header-title">Motoristas & Viaturas</div>
      <div class="page-header-sub">Gerir equipa e frota</div>
    </div>
  </div>
  <div class="container">
    <div class="team-grid">
      <!-- MOTORISTAS -->
      <div class="team-card">
        <div class="team-card-header">
          <span class="team-card-title">🧑‍✈️ Motoristas</span>
        </div>
        <div class="team-card-body" id="drivers-list">
          <div class="empty">A carregar…</div>
        </div>
        <div class="add-form">
          <input class="add-input" id="new-driver-name" placeholder="Nome do motorista" />
          <input class="add-input" id="new-driver-phone" placeholder="Telemóvel" style="max-width:130px;" />
          <button class="btn-add" onclick="addDriver()">Adicionar</button>
        </div>
      </div>

      <!-- VIATURAS -->
      <div class="team-card">
        <div class="team-card-header">
          <span class="team-card-title">🚗 Viaturas</span>
        </div>
        <div class="team-card-body" id="vehicles-list">
          <div class="empty">A carregar…</div>
        </div>
        <div class="add-form">
          <input class="add-input" id="new-vehicle-name" placeholder="Modelo / Matrícula" />
          <button class="btn-add" onclick="addVehicle()">Adicionar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- CALENDÁRIO -->
<div id="page-calendario" class="page">
  <div class="page-header">
    <div style="display:flex;align-items:center;gap:16px;">
      <button onclick="calPrev()" style="background:none;border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;">‹</button>
      <span id="cal-title" style="font-size:15px;font-weight:600;min-width:160px;text-align:center;"></span>
      <button onclick="calNext()" style="background:none;border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;">›</button>
    </div>
  </div>
  <div id="cal-grid" style="padding:0 24px 24px;"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// all data via Netlify Function → Google Sheets

let transfers = [], drivers = [], vehicles = [], currentFilter = 'todos';

function fmtDate(d) {
  if (!d) return '—';
  const [y, m, day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function fmtTime(t) { return t ? t.slice(0,5) : '—'; }
function dirLabel(d) {
  if (d === 'h2a') return '<span class="dir-badge dir-h2a">Hotel → Aeroporto</span>';
  return '<span class="dir-badge dir-a2h">Aeroporto → Hotel</span>';
}

// ── TAB ──────────────────────────────────────────
function switchTab(t) {
  document.querySelectorAll('.tab').forEach((b, i) => b.classList.toggle('active', (t === 'servicos' && i === 0) || (t === 'equipa' && i === 1) || (t === 'calendario' && i === 2)));
  document.getElementById('page-servicos').classList.toggle('active', t === 'servicos');
  document.getElementById('page-equipa').classList.toggle('active', t === 'equipa');
  document.getElementById('page-calendario').classList.toggle('active', t === 'calendario');
  if (t === 'calendario') renderCalendar();
}

// ── CALENDAR ─────────────────────────────────────
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

const CAL_MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CAL_DAYS = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

function calPrev() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); }
function calNext() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); }

function renderCalendar() {
  document.getElementById('cal-title').textContent = CAL_MONTHS[calMonth] + ' ' + calYear;

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = new Date();

  // index transfers by date
  const byDate = {};
  transfers.forEach(t => {
    if (!t.date || t.status === 'cancelado') return;
    if (!byDate[t.date]) byDate[t.date] = [];
    byDate[t.date].push(t);
  });

  let html = `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;">`;
  CAL_DAYS.forEach(d => { html += `<div style="text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;">${d}</div>`; });
  html += `</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">`;

  // empty cells before first day
  for (let i = 0; i < firstDay; i++) html += `<div></div>`;

  for (let day = 1; day <= daysInMonth; day++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dayTransfers = byDate[dateStr] || [];
    const isToday = today.getFullYear() === calYear && today.getMonth() === calMonth && today.getDate() === day;

    const borderStyle = isToday ? 'border:1.5px solid var(--gold);' : 'border:1px solid var(--border);';
    html += `<div style="min-height:80px;border-radius:8px;padding:6px;${borderStyle}background:var(--surface);">`;
    html += `<div style="font-size:12px;font-weight:${isToday?'700':'500'};color:${isToday?'var(--gold)':'var(--text)'};margin-bottom:4px;">${day}</div>`;

    dayTransfers.forEach(t => {
      const color = t.dir === 'a2h' ? '#1baf7a' : '#4a6fa5';
      const icon = t.dir === 'a2h' ? '✈→🏨' : '🏨→✈';
      html += `<div title="${t.name} — ${t.hotel}" style="font-size:10px;background:${color}22;color:${color};border-radius:4px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">`;
      html += `${icon} ${fmtTime(t.time)} ${t.name}</div>`;
    });

    html += `</div>`;
  }

  html += `</div>`;
  document.getElementById('cal-grid').innerHTML = html;
}

// ── FILTER ───────────────────────────────────────
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTransfers();
}

// ── TOAST ────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

const API = '/.netlify/functions/sheets';

// ── LOAD ─────────────────────────────────────────
async function loadAll() {
  const [tr, dr, ve] = await Promise.all([
    fetch(`${API}?type=transfers`).then(r => r.json()),
    fetch(`${API}?type=drivers`).then(r => r.json()),
    fetch(`${API}?type=vehicles`).then(r => r.json()),
  ]);
  transfers = Array.isArray(tr) ? tr : [];
  drivers = Array.isArray(dr) ? dr : [];
  vehicles = Array.isArray(ve) ? ve : [];
  renderTransfers();
  renderDrivers();
  renderVehicles();
}

// ── RENDER TRANSFERS ─────────────────────────────
function renderTransfers() {
  const tbody = document.getElementById('transfers-tbody');
  let list = currentFilter === 'todos' ? transfers : transfers.filter(t => t.status === currentFilter);

  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty">Sem serviços neste estado.</td></tr>';
    return;
  }

  tbody.innerHTML = list.map(t => {
    const driverOpts = drivers.map(d => `<option value="${d.id}" ${String(t.driver) === String(d.id) ? 'selected' : ''}>${d.name}</option>`).join('');
    const vehicleOpts = vehicles.map(v => `<option value="${v.id}" ${String(t.vehicle) === String(v.id) ? 'selected' : ''}>${v.name}</option>`).join('');
    const statusClass = t.status || 'pendente';

    return `<tr>
      <td>
        <div class="cell-name">${t.name || '—'}</div>
        <div class="cell-hotel">${t.hotel || '—'}</div>
      </td>
      <td>
        <div>${fmtDate(t.date)}</div>
        <div class="cell-sub">${fmtTime(t.time)}</div>
      </td>
      <td>${dirLabel(t.dir)}</td>
      <td>
        <div>${t.flight || '—'}</div>
        ${t.arrival ? `<div class="cell-sub">cheg. ${fmtTime(t.arrival)}</div>` : ''}
      </td>
      <td>${(parseInt(t.adults)||0) + (parseInt(t.children)||0)} pax</td>
      <td>
        <select class="inline-select" id="dr-${t.id}" onchange="markDirty('${t.id}')">
          <option value="">— motorista —</option>
          ${driverOpts}
        </select>
      </td>
      <td>
        <select class="inline-select" id="ve-${t.id}" onchange="markDirty('${t.id}')">
          <option value="">— viatura —</option>
          ${vehicleOpts}
        </select>
      </td>
      <td>
        <select class="status-select ${statusClass}" id="st-${t.id}" onchange="onStatusChange('${t.id}', this)">
          <option value="pendente" ${t.status==='pendente'||t.status==='novo'?'selected':''}>Pendente</option>
          <option value="confirmado" ${t.status==='confirmado'?'selected':''}>Confirmado</option>
          <option value="concluido" ${t.status==='concluido'?'selected':''}>Concluído</option>
          <option value="cancelado" ${t.status==='cancelado'?'selected':''}>Cancelado</option>
        </select>
      </td>
      <td>
        <button class="btn-save" id="save-${t.id}" onclick="saveTransfer('${t.id}')" disabled>Guardar</button>
      </td>
    </tr>`;
  }).join('');
}

function onStatusChange(id, sel) {
  sel.className = 'status-select ' + sel.value;
  markDirty(id);
}

function markDirty(id) {
  const btn = document.getElementById('save-' + id);
  if (btn) btn.disabled = false;
}

async function saveTransfer(id) {
  const driverVal = document.getElementById('dr-' + id)?.value || null;
  const vehicleVal = document.getElementById('ve-' + id)?.value || null;
  const statusVal = document.getElementById('st-' + id)?.value;

  const res = await fetch(`${API}?type=transfers`, {
    method: 'PUT',
    body: JSON.stringify({ id, driver: driverVal || '', vehicle: vehicleVal || '', status: statusVal })
  });

  if (!res.ok) { showToast('Erro ao guardar'); return; }
  const t = transfers.find(x => String(x.id) === String(id));
  if (t) { t.driver = driverVal; t.vehicle = vehicleVal; t.status = statusVal; }
  const btn = document.getElementById('save-' + id);
  if (btn) btn.disabled = true;
  showToast('Guardado ✓');
}

// ── RENDER DRIVERS ────────────────────────────────
function renderDrivers() {
  const el = document.getElementById('drivers-list');
  if (!drivers.length) { el.innerHTML = '<div class="empty">Sem motoristas.</div>'; return; }
  el.innerHTML = drivers.map(d => `
    <div class="team-list-item" id="driver-row-${d.id}">
      <div style="flex:1;" id="driver-view-${d.id}">
        <div class="team-item-name">${d.name}</div>
        ${d.phone ? `<div class="team-item-sub">${d.phone}</div>` : ''}
      </div>
      <div style="flex:1;display:none;gap:8px;" id="driver-edit-${d.id}">
        <input class="add-input" id="driver-edit-name-${d.id}" value="${d.name}" style="flex:1;" />
        <input class="add-input" id="driver-edit-phone-${d.id}" value="${d.phone||''}" style="max-width:120px;" placeholder="Telemóvel" />
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <button class="btn-add" id="driver-save-btn-${d.id}" style="display:none;padding:6px 12px;font-size:12px;" onclick="saveDriver(${d.id})">Guardar</button>
        <button class="btn-add" id="driver-edit-btn-${d.id}" style="padding:6px 12px;font-size:12px;background:transparent;border:1px solid var(--border);color:var(--text);" onclick="startEditDriver(${d.id})">Editar</button>
        <button class="btn-remove" onclick="removeDriver(${d.id})">Remover</button>
      </div>
    </div>`).join('');
}

function startEditDriver(id) {
  document.getElementById('driver-view-' + id).style.display = 'none';
  document.getElementById('driver-edit-' + id).style.display = 'flex';
  document.getElementById('driver-edit-btn-' + id).style.display = 'none';
  document.getElementById('driver-save-btn-' + id).style.display = '';
}

async function saveDriver(id) {
  const name = document.getElementById('driver-edit-name-' + id).value.trim();
  const phone = document.getElementById('driver-edit-phone-' + id).value.trim();
  if (!name) return;
  const res = await fetch(`${API}?type=drivers`, { method: 'PUT', body: JSON.stringify({ id, name, phone }) });
  if (!res.ok) { showToast('Erro ao guardar'); return; }
  await loadAll();
  showToast('Motorista atualizado ✓');
}

async function addDriver() {
  const name = document.getElementById('new-driver-name').value.trim();
  const phone = document.getElementById('new-driver-phone').value.trim();
  if (!name) return;
  const res = await fetch(`${API}?type=drivers`, { method: 'POST', body: JSON.stringify({ name, phone }) });
  if (!res.ok) { showToast('Erro ao adicionar'); return; }
  document.getElementById('new-driver-name').value = '';
  document.getElementById('new-driver-phone').value = '';
  await loadAll();
  showToast('Motorista adicionado ✓');
}

async function removeDriver(id) {
  if (!confirm('Remover este motorista?')) return;
  await fetch(`${API}?type=drivers`, { method: 'DELETE', body: JSON.stringify({ id }) });
  await loadAll();
  showToast('Removido ✓');
}

// ── RENDER VEHICLES ───────────────────────────────
function renderVehicles() {
  const el = document.getElementById('vehicles-list');
  if (!vehicles.length) { el.innerHTML = '<div class="empty">Sem viaturas.</div>'; return; }
  el.innerHTML = vehicles.map(v => `
    <div class="team-list-item" id="vehicle-row-${v.id}">
      <div style="flex:1;" id="vehicle-view-${v.id}">
        <div class="team-item-name">${v.name}</div>
      </div>
      <div style="flex:1;display:none;gap:8px;" id="vehicle-edit-${v.id}">
        <input class="add-input" id="vehicle-edit-name-${v.id}" value="${v.name}" style="flex:1;" />
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;">
        <button class="btn-add" id="vehicle-save-btn-${v.id}" style="display:none;padding:6px 12px;font-size:12px;" onclick="saveVehicle(${v.id})">Guardar</button>
        <button class="btn-add" id="vehicle-edit-btn-${v.id}" style="padding:6px 12px;font-size:12px;background:transparent;border:1px solid var(--border);color:var(--text);" onclick="startEditVehicle(${v.id})">Editar</button>
        <button class="btn-remove" onclick="removeVehicle(${v.id})">Remover</button>
      </div>
    </div>`).join('');
}

function startEditVehicle(id) {
  document.getElementById('vehicle-view-' + id).style.display = 'none';
  document.getElementById('vehicle-edit-' + id).style.display = 'flex';
  document.getElementById('vehicle-edit-btn-' + id).style.display = 'none';
  document.getElementById('vehicle-save-btn-' + id).style.display = '';
}

async function saveVehicle(id) {
  const name = document.getElementById('vehicle-edit-name-' + id).value.trim();
  if (!name) return;
  const res = await fetch(`${API}?type=vehicles`, { method: 'PUT', body: JSON.stringify({ id, name }) });
  if (!res.ok) { showToast('Erro ao guardar'); return; }
  await loadAll();
  showToast('Viatura atualizada ✓');
}

async function addVehicle() {
  const name = document.getElementById('new-vehicle-name').value.trim();
  if (!name) return;
  const res = await fetch(`${API}?type=vehicles`, { method: 'POST', body: JSON.stringify({ name }) });
  if (!res.ok) { showToast('Erro ao adicionar'); return; }
  document.getElementById('new-vehicle-name').value = '';
  await loadAll();
  showToast('Viatura adicionada ✓');
}

async function removeVehicle(id) {
  if (!confirm('Remover esta viatura?')) return;
  await fetch(`${API}?type=vehicles`, { method: 'DELETE', body: JSON.stringify({ id }) });
  await loadAll();
  showToast('Removido ✓');
}

// ── INIT ──────────────────────────────────────────
loadAll();
</script>
